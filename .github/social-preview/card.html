<!doctype html>
<!--
  The repository's social preview: the card GitHub shows wherever the repo
  link is shared. It is set by hand at Settings > General > Social preview,
  because GitHub exposes no API for it, so the rendered PNG beside this file
  is the thing that was actually uploaded.

  Re-render after changing anything here:

      google-chrome --headless --no-sandbox --window-size=1280,640 \
        --screenshot=janela-social-preview.png card.html

  Snap-confined Chromium cannot write to a hidden directory under $HOME, so
  use the deb Chrome, or render somewhere visible.

  The window is copied from test/dummy/app/views/shared/_logo.html.erb and
  the colours from app/assets/stylesheets/vitral.css. A static file cannot
  run ERB, so this is a copy rather than a reference: change the mark or the
  theme and this card has to be re-rendered and re-uploaded to match.
-->
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:640px; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #e3eaf3;
    color: #16202b;
    position: relative;
    overflow: hidden;
  }
  /* The sun outside the window, top right, where the theme puts it. */
  .sun {
    position:absolute; top:-220px; right:-140px; width:760px; height:760px;
    background: radial-gradient(circle,
      rgba(255,252,244,0.95) 0%, rgba(255,252,244,0.55) 26%,
      rgba(255,252,244,0.16) 52%, rgba(255,252,244,0) 70%);
  }
  /* The shafts that sun throws across the room. */
  .shafts { position:absolute; inset:0; overflow:hidden; }
  .shaft {
    position:absolute; top:-460px; right:-40px;
    width:150px; height:1700px;
    background: linear-gradient(180deg, rgba(255,253,248,0.85), rgba(255,253,248,0));
    transform-origin: top center;
  }
  /* The lattice, held back where the words are, as vitral.css masks it. */
  .lattice { position:absolute; inset:0; opacity:.5;
    background-image:
      linear-gradient(rgba(44,62,84,0.13) 1px, transparent 1px),
      linear-gradient(90deg, rgba(44,62,84,0.13) 1px, transparent 1px);
    background-size: 46px 46px;
    -webkit-mask-image: linear-gradient(90deg, #000 0 8%, rgba(0,0,0,.30) 26%, rgba(0,0,0,.30) 60%, #000 78% 100%);
  }
  .wrap {
    position:relative; height:100%;
    display:flex; align-items:center; gap:76px;
    padding: 0 92px;
  }
  .mark { flex:none; filter: drop-shadow(0 6px 16px rgba(16,24,40,.22)); }
  .words { min-width:0; }
  h1 { font-size:132px; line-height:.94; font-weight:680; letter-spacing:-0.045em; }
  .rule { width:96px; height:7px; border-radius:4px; margin:30px 0 26px;
    background: linear-gradient(90deg,#3a7aeb,#1ca89e,#f0b046,#e06082); }
  p.tag { font-size:35px; line-height:1.34; font-weight:450; color:#28374a;
    letter-spacing:-0.016em; max-width:600px; }
  p.foot { margin-top:34px; font-size:23px; font-weight:560; color:#4a5766;
    letter-spacing:.005em; }
  p.foot b { color:#1a5fbd; font-weight:600; }
</style></head><body>
  <div class="sun"></div>
  <div class="shafts">
    <div class="shaft" style="transform:rotate(19deg); opacity:.85"></div>
    <div class="shaft" style="transform:rotate(26deg) translateX(-190px); width:86px; opacity:.6"></div>
    <div class="shaft" style="transform:rotate(14deg) translateX(150px); width:60px; opacity:.5"></div>
    <div class="shaft" style="transform:rotate(31deg) translateX(-390px); width:120px; opacity:.42"></div>
  </div>
  <div class="lattice"></div>

  <div class="wrap">
    <!-- The viewBox is taller and wider than the partial's, so the light
         fans clear of the window rather than being clipped at its sill. -->
    <svg class="mark" viewBox="-9 1 50 44" width="360" height="317" role="img" aria-label="Janela">
      <defs>
        <clipPath id="w"><path d="M5 15a11 11 0 0 1 22 0v11a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z"/></clipPath>
        <linearGradient id="r0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".22" stop-color="#e0607f" stop-opacity=".55"/><stop offset="1" stop-color="#e0607f" stop-opacity="0"/></linearGradient>
        <linearGradient id="r1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".22" stop-color="#f0b046" stop-opacity=".55"/><stop offset="1" stop-color="#f0b046" stop-opacity="0"/></linearGradient>
        <linearGradient id="r2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".22" stop-color="#1ca89e" stop-opacity=".55"/><stop offset="1" stop-color="#1ca89e" stop-opacity="0"/></linearGradient>
        <linearGradient id="r3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".22" stop-color="#3a7aeb" stop-opacity=".55"/><stop offset="1" stop-color="#3a7aeb" stop-opacity="0"/></linearGradient>
        <linearGradient id="r4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".22" stop-color="#8a6ee4" stop-opacity=".55"/><stop offset="1" stop-color="#8a6ee4" stop-opacity="0"/></linearGradient>
        <linearGradient id="r5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".22" stop-color="#1ca89e" stop-opacity=".55"/><stop offset="1" stop-color="#1ca89e" stop-opacity="0"/></linearGradient>
        <linearGradient id="r6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".22" stop-color="#e0607f" stop-opacity=".55"/><stop offset="1" stop-color="#e0607f" stop-opacity="0"/></linearGradient>
      </defs>
      <!-- Fully fanned, where the demo animates it open on load. -->
      <g aria-hidden="true">
        <g transform="rotate(-64 16 19)"><path d="M16 19 L11.8 54 L20.2 54 Z" fill="url(#r0)"/></g>
        <g transform="rotate(-43 16 19)"><path d="M16 19 L11.8 54 L20.2 54 Z" fill="url(#r1)"/></g>
        <g transform="rotate(-21 16 19)"><path d="M16 19 L11.8 54 L20.2 54 Z" fill="url(#r2)"/></g>
        <g transform="rotate(0 16 19)"><path d="M16 19 L11.8 54 L20.2 54 Z" fill="url(#r3)"/></g>
        <g transform="rotate(21 16 19)"><path d="M16 19 L11.8 54 L20.2 54 Z" fill="url(#r4)"/></g>
        <g transform="rotate(43 16 19)"><path d="M16 19 L11.8 54 L20.2 54 Z" fill="url(#r5)"/></g>
        <g transform="rotate(64 16 19)"><path d="M16 19 L11.8 54 L20.2 54 Z" fill="url(#r6)"/></g>
      </g>
      <g clip-path="url(#w)">
        <path d="M0 0h17v13H0z" fill="#3a7aeb" fill-opacity=".85"/>
        <path d="M17 0h15v13H17z" fill="#1ca89e" fill-opacity=".85"/>
        <path d="M0 13h17v10H0z" fill="#8a6ee4" fill-opacity=".7"/>
        <path d="M17 13h15v10H17z" fill="#f0b046" fill-opacity=".9"/>
        <path d="M0 23h32v9H0z" fill="#e06082" fill-opacity=".8"/>
      </g>
      <g stroke="#1a2636" fill="none" stroke-linejoin="round">
        <path d="M5 15a11 11 0 0 1 22 0v11a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z" stroke-width="1.5"/>
        <path d="M16 4v25M5.5 13h21M5 23h22" stroke-width="0.9"/>
      </g>
    </svg>
    <div class="words">
      <h1>Janela</h1>
      <div class="rule"></div>
      <p class="tag">Cross-filtering dashboards, native to Rails and ActiveRecord.</p>
      <p class="foot">A Rails engine &nbsp;&middot;&nbsp; <b>demo.janela.winontheshelf.com</b></p>
    </div>
  </div>
</body></html>
