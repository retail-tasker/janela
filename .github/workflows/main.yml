name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '3.3'
          - '3.4'
          - '4.0'

    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake

  system:
    runs-on: ubuntu-latest
    name: Cross-filtering in a browser
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      # The runner image ships a matched Chrome and chromedriver pair.
      # Installing either separately desynchronises them.
      - name: Run system tests
        run: bundle exec rake system
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: test/dummy/tmp/screenshots
          if-no-files-found: ignore
