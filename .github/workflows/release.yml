name: Release

# Publishes the gem to rubygems.org through trusted publishing: rubygems.org
# trusts this workflow's OIDC token, so no API key exists anywhere.
# Fires on a version tag, or by hand against an existing tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.1.0"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # A tag push starts this, and the gem cannot be unpublished, so the job
    # waits for one of the two maintainers to approve it (RELEASING.md). The
    # environment only accepts runs from a v* tag, so a manual run has to be
    # started from the tag and not from a branch.
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: rubygems/release-gem@v1
