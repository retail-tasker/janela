en:
  activerecord:
    models:
      janela/frame:
        one: Frame
        other: Frames
      janela/pane:
        one: Pane
        other: Panes
    attributes:
      janela/frame:
        name: Name
        columns: Columns
        gap: Gap
      janela/pane:
        model: Model
        measure: Measure
        dimension: Dimension
        renderer: Renderer
        granularity: Granularity
        limit: Rows
        sort: Order
        span: Width
        height: Height
        prominence: Prominence
        value_labels: Show each bar's value
        companions: Beside the label
        cumulative: Running total
        series: More series
        ignore_unknown_filters: Ignore filters this model cannot apply
        title: Title
  janela:
    errors:
      not_found: There is no such pane.
      bad_request: That request is not allowed on this pane.
    actions:
      add_pane: "Add a %{name}"
      cancel: Cancel
      continue: Continue
      delete: Remove
      delete_frame: "Delete this %{name}"
      edit: Edit
      home: "Back to the site"
      move_down: Down
      move_up: Up
      new_frame: "New %{name}"
      save: Save
      view: View
    frames:
      created: Created.
      destroyed: Deleted.
      updated: Saved.
      index:
        blank: "No %{name} yet."
      edit:
        blank: "No %{name} yet."
      frame:
        panes:
          zero: no panes
          one: 1 pane
          other: "%{count} panes"
        changed: "changed %{time} ago"
    panes:
      created: Added.
      destroyed: Removed.
      updated: Saved.
      declared_granularity: As the model declares it
      granularity_hint: "Applies to %{dimensions} only."
      no_dimension: "No breakdown, one number"
      no_limit: Every row
      summary: "%{renderer}, %{span} wide"
      content_summary: "%{kind}, %{span} wide"
      numbers: Numbers
      words: Words
      text: Text
      link_hint: "A path on this site, such as /orders. Makes the heading a link."
      title_placeholder: Janela writes one if you leave this blank
    companions:
      measures: Measures
      dimensions: Dimensions
      hint: Up to three, drawn as columns in a table. A dimension shows a value only where every row of its group shares one.
    ignore_unknown_filters:
      hint: For a pane beside panes over another model. A click there names a dimension this model does not have, and this pane stays as it is instead of saying the request is not allowed. A filter nobody's model declares is still a mistake on every other pane.
    value_labels:
      hint: Draws the value at the end of each bar of a bar chart, if every one fits, and a line's latest value at its end. A ring ignores it.
    series:
      to_date: "%{label} to date"
      cumulative_hint: Adds the measure up across the buckets, so the pane reads as a total to date. Applies to a time dimension.
      hint: Up to %{count} more measures over the same buckets, each a line or bars on the left axis or a right one. A table draws them as columns. A ring ignores them.
      measure: Measure
      by: Over
      as: Drawn as
      axis: Axis
      none: None
      same_as_pane: Same as the pane
      axes:
        left: Left
        right: Right
    sorts:
      desc: Largest first
      asc: Smallest first
      label: By label, A to Z
      label_desc: By label, Z to A
      hint: Applies to a breakdown by a category. A time series is always in time order.
    prominences:
      automatic: Automatic
      "1": Footnote
      "2": Normal
      "3": Hero
    heights:
      automatic: Automatic
      "1": Very short
      "2": Short
      "3": Medium
      "4": Tall
      "5": Very tall
    renderers:
      bar: Bar chart
      doughnut: Doughnut chart
      line: Line chart
      pie: Pie chart
      table: Table
    time:
      click_hint: Choose a period to filter the other panes to it. Ctrl or Cmd does not add a second period.
    rings:
      not_drawable: A ring cannot show a negative value or a total of nothing, so this is drawn as a table.
