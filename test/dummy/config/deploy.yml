# Deploys the demo (this dummy host application) with Kamal.
# Serving plain HTTP on the IP until the demo has a domain; then set
# proxy.ssl true, proxy.host and DEMO_HOST to the domain.
service: janela-demo
image: retail-tasker/janela-demo

servers:
  web:
    - 172.105.163.60

proxy:
  ssl: false
  app_port: 3000
  healthcheck:
    path: /up
    interval: 3
    timeout: 90

registry:
  server: ghcr.io
  username: jaykilleen
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    RAILS_ENV: production
    RAILS_LOG_LEVEL: info
    DEMO_HOST: 172.105.163.60
  secret:
    - SECRET_KEY_BASE

builder:
  arch: amd64
  dockerfile: ../../Dockerfile
  context: ../..

ssh:
  user: root

volumes:
  - janela_demo_storage:/rails/test/dummy/storage
