# Deploys the demo (this dummy host application) with Kamal.
# The domain is not kept in this file: CI passes DEMO_HOST from a repository
# variable. Without it the demo serves plain HTTP on the host's IP.
<% host = ENV["DEMO_HOST"].to_s.strip %>
service: janela-demo
image: retail-tasker/janela-demo

servers:
  web:
    - 172.105.163.60

proxy:
  app_port: 3000
<% if host.empty? %>
  ssl: false
<% else %>
  ssl: true
  host: <%= host %>
<% end %>
  healthcheck:
    path: /up
    interval: 3
    timeout: 90

registry:
  server: ghcr.io
  username: jaykilleen
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    RAILS_ENV: production
    RAILS_LOG_LEVEL: info
    DEMO_HOST: <%= host.empty? ? "172.105.163.60" : host %>
  secret:
    - SECRET_KEY_BASE

builder:
  arch: amd64
  dockerfile: ../../Dockerfile
  context: ../..

ssh:
  user: root

volumes:
  - janela_demo_storage:/rails/test/dummy/storage
